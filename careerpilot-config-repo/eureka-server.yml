server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # The registry doesn't register with itself or fetch a registry of peers -
    # this overrides the client defaults inherited from the global application.yml.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
