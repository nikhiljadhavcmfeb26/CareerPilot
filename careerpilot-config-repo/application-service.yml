server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:careerpilot_application}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            # Resume downloads proxy a file through this service (application-service
            # -> user-service -> back here -> browser) - a bit more headroom than the
            # default 5s read timeout other services use, since it's carrying a file
            # rather than a small JSON payload.
            readTimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
